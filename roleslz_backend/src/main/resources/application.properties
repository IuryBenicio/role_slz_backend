spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create

# NOTA: server.tomcat.threads.max foi removido daqui.
# Com spring.threads.virtual.enabled=true o Tomcat passa a usar um executor de
# virtual threads e essa propriedade deixa de ter efeito. Mantê-la dava a falsa
# impressao de haver um limite de 8 requisicoes simultaneas.

spring.threads.virtual.enabled=true

google.client.id=${ID_CLIENT}

spring.application.name=roleslz_backend
server.port=8090

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

api.security.token.secret=${JWT_SECRET}
# Validade do JWT em dias (o app não tem refresh token; era 1 ano antes).
api.security.token.expiration-days=30

app.host.link=http://localhost:8090

#Firebase (service account no classpath; NÃO versionado — ver .gitignore)
firebase.credentials.classpath=firebasekey.json

#logging.level.org.hibernate=DEBUG
#logging.level.org.springframework.orm.jpa=DEBUG

# URL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# POOL DE CONEXOES (HikariCP)
#
# Antes nao havia nenhuma destas linhas, ou seja: 10 conexoes, o default
# implicito do Hikari, e todos os timeouts no default. Isso e especialmente
# perigoso aqui porque virtual threads estao ligadas: o Tomcat aceita milhares
# de requisicoes simultaneas, e todas disputam estas mesmas conexoes. Loom nao
# multiplica o banco, so faz a fila se formar mais rapido e mais silenciosamente.
#
# O numero certo nao e "o maior possivel": cada conexao e um processo no
# Postgres. Pool maior que a capacidade real do banco troca espera por
# thrashing. 10 para 1-2 vCPU e uma faixa saudavel; sobe via DB_POOL_SIZE
# sem rebuild, se a medicao pedir.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=SpotRolePool

# Falhar rapido e melhor que enfileirar. Sem este limite curto, um pico deixa
# requisicao pendurada esperando conexao ate o timeout do cliente, e o usuario
# ve o app "travado" em vez de um erro. 10s ja e uma eternidade para uma query.
spring.datasource.hikari.connection-timeout=10000

# Denuncia no log quem segurou uma conexao por mais de 20s. Foi exatamente o
# caso do scheduler que chamava o Firebase dentro da transacao: com isto ligado,
# aquele bug teria aparecido sozinho no log em vez de virar lentidao misteriosa.
spring.datasource.hikari.leak-detection-threshold=20000

# Recicla conexoes antes que o servidor ou algum proxy as derrube por idade.
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.validation-timeout=3000
# ---------------------------------------------------------------------------


#EM PRODUÇÃO

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=false

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_NAME}
cloudinary.api_key=${CLOUDINARY_API}
cloudinary.api_secret=${CLOUDINARY_SECRET}

# Minutos que o aparelho precisa ficar dentro da cerca para o check-in valer (Dwell Time).
spotrole.checkin.dwell-minutos=15

# Criacao idempotente dos indices que o Hibernate nao gera (inclusive o GIST da
# coluna geometry). Ver DatabaseIndexInitializer. Desligue so se for passar a
# gerenciar o schema por migrations.
spotrole.indices.auto-criar=true
