spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create

server.tomcat.threads.max=8

spring.threads.virtual.enabled=true

google.client.id=${ID_CLIENT}

spring.application.name=roleslz_backend
server.port=8090

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

api.security.token.secret=${JWT_SECRET}
# Validade do JWT em dias (o app não tem refresh token; era 1 ano antes).
api.security.token.expiration-days=30

app.host.link=http://localhost:8090

#Firebase (service account no classpath; NÃO versionado — ver .gitignore)
firebase.credentials.classpath=firebasekey.json

#logging.level.org.hibernate=DEBUG
#logging.level.org.springframework.orm.jpa=DEBUG

# URL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


#EM PRODUÇÃO

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=false

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_NAME}
cloudinary.api_key=${CLOUDINARY_API}
cloudinary.api_secret=${CLOUDINARY_SECRET}
