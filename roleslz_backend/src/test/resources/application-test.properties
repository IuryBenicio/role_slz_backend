# Perfil "test": valores dummy para as variáveis que em produção vêm do .env,
# para o contexto Spring subir nos testes (@ActiveProfiles("test")).
# O datasource é injetado em runtime pelo Testcontainers (@DynamicPropertySource).

google.client.id=test-client-id
api.security.token.secret=test-jwt-secret-please-change

spring.mail.username=test@example.com
spring.mail.password=test-mail-password

cloudinary.cloud_name=test-cloud
cloudinary.api_key=test-key
cloudinary.api_secret=test-secret

# Redis embutido não é usado nos testes de contexto; a fábrica Lettuce conecta de forma preguiçosa.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Não bloquear o encerramento do contexto esperando tarefas agendadas/assíncronas
# (evita a JVM de teste demorar ~30s para sair depois do smoke test).
spring.task.scheduling.shutdown.await-termination=false
spring.task.execution.shutdown.await-termination=false

# Schema criado pelo Hibernate no container limpo
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# service account FAKE (chave RSA descartável), commitado em src/test/resources
firebase.credentials.classpath=firebasekey-test.json
