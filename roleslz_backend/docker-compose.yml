# Senhas vêm do .env desta pasta (o Docker Compose lê automaticamente) — nunca
# literais aqui: este arquivo é versionado. As portas ficam presas ao 127.0.0.1
# para o banco não ficar exposto na rede local.
services:
  db:
    image: postgis/postgis:15-3.4
    container_name: spotrole_db
    restart: always
    environment:
      POSTGRES_USER: iurybenicio
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_DB: spotrole
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: spotrole_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@spotrole.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - db
volumes:
  postgres_data: